# Verification only. This workflow builds and tests with mock providers; it needs no paid key and it
# does not publish, tag or ship anything. It is NOT evidence about the Mac hardware encoder: Linux
# runs the software libx264 encoder, so VideoToolbox is judged only by the local benchmark in
# docs/pilot-results.md. It has never run (no remote repository is connected); enabling it is the
# owner's decision.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ALLOW_PAID_APIS: 'false'
  AUTO_PUBLISH: 'false'
  PUBLISHING_MODE: 'manual_export'
  TEXT_PROVIDER: 'mock'
  VIDEO_PROVIDER: 'mock'
  VOICE_PROVIDER: 'mock'
  ENABLE_SCHEDULES: 'false'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: FFmpeg (software libx264) and a Thai font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-thai-tlwg
          ffmpeg -hide_banner -filters | grep -q ' subtitles ' || { echo 'FFmpeg lacks libass'; exit 1; }

      - name: Scratch PostgreSQL on loopback
        run: |
          docker run -d --name content-factory-postgres -e POSTGRES_PASSWORD=ci-only -e POSTGRES_USER=content_factory \
            -p 127.0.0.1:54329:5432 postgres:18-alpine
          for i in $(seq 1 30); do docker exec content-factory-postgres pg_isready -U content_factory && break; sleep 2; done

      - name: Verify every gate (mock providers only)
        run: |
          export CF_TEST_POSTGRES='Host=127.0.0.1;Port=54329;Database=postgres;Username=content_factory;Password=ci-only'
          export CAPTION_FONT_FILE=/usr/share/fonts/truetype/tlwg/Loma.ttf
          (cd apps/dashboard && npx playwright install --with-deps chromium)
          ./scripts/verify-all.sh
